<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				var persona = 'pring';
				var mode = 'system';
				try {
					persona = localStorage.getItem('persona') === 'natalie' ? 'natalie' : 'pring';
					mode = localStorage.getItem('color-mode') || 'system';
				} catch (e) {}
				var dark =
					mode === 'dark' ||
					(mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = persona + (dark ? '-dark' : '-light');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
